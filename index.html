<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teachers Day QR Verification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Qwigley&display=swap" rel="stylesheet">

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
*{box-sizing:border-box}

:root{
  --blue:#0878e8;
  --blue-dark:#075fc0;
  --navy:#172b49;
  --muted:#667085;
  --line:#dbe5f1;
  --green:#16a34a;
  --red:#dc2626;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--navy);
  background:
    radial-gradient(circle at 0% 0%,rgba(92,157,255,.18) 0 90px,transparent 91px),
    radial-gradient(circle at 100% 15%,rgba(92,157,255,.12) 0 105px,transparent 106px),
    radial-gradient(circle at 4% 70%,rgba(92,157,255,.15) 0 75px,transparent 76px),
    radial-gradient(circle at 100% 78%,rgba(92,157,255,.14) 0 110px,transparent 111px),
    linear-gradient(180deg,#f8fbff 0%,#eef5ff 100%);
}

body:before,
body:after{
  content:"";
  position:fixed;
  width:170px;
  height:170px;
  border-radius:50%;
  background-image:radial-gradient(#b9d5fb 1.7px,transparent 1.7px);
  background-size:15px 15px;
  opacity:.42;
  pointer-events:none;
  z-index:0;
}
body:before{left:-55px;top:115px}
body:after{right:-45px;bottom:70px}

.container{
  position:relative;
  z-index:1;
  width:100%;
  max-width:720px;
  margin:auto;
  padding:24px 16px 82px;
}

.header{
  text-align:center;
  margin-bottom:22px;
}

.logo{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:62px;
  height:52px;
  margin-bottom:5px;
  border-radius:13px;
  background:linear-gradient(135deg,#0b7bea,#075bc0);
  border:3px solid #073b7a;
  color:#fff;
  font-size:30px;
  box-shadow:0 7px 18px rgba(0,91,190,.22);
}

h1{
  margin:0;
  font-size:38px;
  font-weight:800;
  letter-spacing:-1px;
}

.subtitle{
  margin-top:7px;
  font-size:19px;
  color:var(--muted);
}

.scanner-card{
  background:rgba(255,255,255,.9);
  border:1px solid rgba(219,229,241,.95);
  border-radius:24px;
  padding:16px;
  box-shadow:0 14px 42px rgba(30,75,130,.10);
  backdrop-filter:blur(4px);
}

.controls{
  text-align:center;
  margin-bottom:8px;
}

button{
  border:0;
  border-radius:13px;
  padding:14px 27px;
  margin:7px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  transition:transform .15s ease,box-shadow .15s ease;
}
button:active{transform:scale(.98)}

.start-btn{
  background:linear-gradient(135deg,var(--blue),var(--blue-dark));
  color:#fff;
  box-shadow:0 7px 18px rgba(8,120,232,.24);
}
.stop-btn{background:#98a4b5;color:#fff}
.next-btn{
  background:linear-gradient(135deg,#16a34a,#12803b);
  color:#fff;
  width:min(100%,390px);
  box-shadow:0 7px 18px rgba(22,163,74,.22);
}

#reader{
  width:100%;
  max-width:620px;
  min-height:300px;
  margin:8px auto 0;
  border-radius:20px;
  overflow:hidden;
  background:#0c1118;
  border:1px solid #17212d;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
}

/* Keep the camera preview clean and dark. */
#reader video{
  border-radius:20px;
}

.instruction{
  text-align:center;
  margin:0;
  padding:13px 10px 4px;
  color:#667085;
  font-size:15px;
}

#loading{
  display:none;
  margin:18px 0 0;
  padding:13px;
  border-radius:12px;
  background:#eaf4ff;
  border:1px solid #cfe4ff;
  color:#1769cf;
  font-size:16px;
  font-weight:700;
}

#result{
  display:none;
  margin:20px auto 0;
  padding:24px 18px 16px;
  border-radius:21px;
  background:rgba(255,255,255,.98);
  border:3px solid var(--green);
  box-shadow:0 10px 30px rgba(16,24,40,.08);
  text-align:center;
}

#result.error{border-color:var(--red)}
#result.warning{border-color:#f59e0b}

.icon{
  font-size:46px;
  line-height:1;
  margin-bottom:8px;
}

.result-title{
  font-size:25px;
  font-weight:800;
  margin-bottom:5px;
  letter-spacing:.2px;
}

.student-name{
  font-size:29px;
  font-weight:800;
  margin:5px 0 16px;
}

.details{
  display:block;
  max-width:520px;
  margin:auto;
  padding:13px 18px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:#fbfcfe;
  border-radius:12px;
  text-align:left;
  color:#344054;
  font-size:16px;
  line-height:1.75;
}

.message{
  margin:14px auto 2px;
  max-width:520px;
  padding:11px 14px;
  border-radius:10px;
  background:#eaf8ef;
  color:#17753a;
  font-size:16px;
  line-height:1.45;
}

#result.error .message{
  background:#fff0f0;
  color:#b42318;
}

.watermark{
  position:fixed;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  z-index:2;
  width:calc(100% - 24px);
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
  white-space:nowrap;
  color:#667085;
  font-size:14px;
  font-weight:600;
  pointer-events:none;
}

.watermark .signature{
  font-family:'Qwigley',cursive;
  font-size:34px;
  line-height:1;
  color:#0878e8;
  font-weight:400;
}

.watermark .class-label{
  font-family:'Qwigley',cursive;
  font-size:28px;
  line-height:1;
  color:#0878e8;
  font-weight:400;
}

.watermark .separator{
  color:#98a2b3;
  font-size:14px;
}

.hidden{display:none!important}

@media(max-width:600px){
  .container{padding:18px 11px 75px}
  h1{font-size:31px}
  .subtitle{font-size:17px}
  .logo{width:56px;height:48px;font-size:27px}
  .scanner-card{padding:11px;border-radius:20px}
  #reader{min-height:270px;border-radius:17px}
  button{width:90%;max-width:320px;font-size:17px}
  .student-name{font-size:26px}
  .result-title{font-size:23px}
  .details{font-size:15px}
}

@media(max-width:600px){
  .watermark{
    gap:9px;
    font-size:11px;
  }
  .watermark .signature{font-size:29px}
  .watermark .class-label{font-size:24px}
}
</style>
</head>

<body>
<div class="container">
  <div class="header">
    <div class="logo">🎫</div>
    <h1>Teachers' Day 2026</h1>
    <div class="subtitle">Student & Teacher QR Verification</div>
  </div>

  <div class="scanner-card">
    <div class="controls">
      <button id="startButton" class="start-btn" onclick="startScanner()">
        📷 Start Camera
      </button>
      <button id="stopButton" class="stop-btn hidden" onclick="stopScanner()">
        ⏹️ Stop Camera
      </button>
    </div>

    <div id="reader"></div>

    <div class="instruction">
     Scan a Student or Teacher QR code
    </div>

    <div id="loading">🔄 Verifying QR code...</div>

    <div id="result">
      <div id="resultIcon" class="icon"></div>
      <div id="resultTitle" class="result-title"></div>
      <div id="studentName" class="student-name"></div>
      <div id="studentDetails" class="details"></div>
      <div id="resultMessage" class="message"></div>

      <button id="nextButton" class="next-btn" onclick="nextScan()">
        ➡️ Scan Next
      </button>
    </div>
  </div>
</div>

<div class="watermark"><span>© Teachers Day QR System</span><span class="separator">|</span><span class="signature">HeavyDukh</span><span class="class-label">Class IX 2026</span></div>

<script>

/* =========================================================
   GOOGLE APPS SCRIPT BACKEND
   ========================================================= */

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbwp1CIZ5tVUa3MyzNsowQLkH1pGjrkW3r-NN2g6_roN6Q33-L-21AqkLmd456wfnen0yw/exec";


/* =========================================================
   SCANNER VARIABLES
   ========================================================= */

let scanner = null;
let scanning = false;
let processing = false;


/* =========================================================
   START CAMERA
   ========================================================= */

function startScanner() {

  if (scanning) return;

  document.getElementById("result").style.display = "none";
  document.getElementById("nextButton").style.display = "none";

  document.getElementById("startButton")
    .classList.add("hidden");

  document.getElementById("stopButton")
    .classList.remove("hidden");

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    onScanSuccess,

    function(errorMessage) {
      // Ignore normal scanning errors
    }

  ).then(function() {

    scanning = true;

  }).catch(function(error) {

    console.error(error);

    alert(
      "Camera could not start.\n\n" +
      "Please allow camera permission and try again."
    );

    resetScannerButtons();

  });
}


/* =========================================================
   QR SCANNED
   ========================================================= */

function onScanSuccess(decodedText) {

  if (processing) return;

  processing = true;

  stopScanner();

  const qrId = decodedText.trim();

  if (!qrId) {

    showResult(
      "error",
      "❌",
      "INVALID QR",
      "",
      "",
      "The QR code is empty or invalid."
    );

    return;
  }

  verifyQR(qrId);
}


/* =========================================================
   VERIFY QR WITH GOOGLE APPS SCRIPT
   ========================================================= */

function verifyQR(qrId) {

  document.getElementById("loading").style.display = "block";

  const callbackName =
    "qrCallback_" + Date.now();

  window[callbackName] = function(data) {

    document.getElementById("loading").style.display = "none";

    try {

      processResult(data);

    } catch (error) {

      console.error(error);

      showResult(
        "error",
        "⚠️",
        "ERROR",
        "",
        "",
        "Could not process the server response."
      );
    }

    delete window[callbackName];

    const script =
      document.getElementById(callbackName);

    if (script) {
      script.remove();
    }
  };


  const script = document.createElement("script");

  script.id = callbackName;

  script.src =
    BACKEND_URL +
    "?qr=" +
    encodeURIComponent(qrId) +
    "&callback=" +
    callbackName +
    "&_=" +
    Date.now();

  script.onerror = function() {

    document.getElementById("loading").style.display = "none";

    showResult(
      "error",
      "⚠️",
      "CONNECTION ERROR",
      "",
      "",
      "Unable to connect to the verification server."
    );

    delete window[callbackName];

    script.remove();
  };

  document.body.appendChild(script);
}


/* =========================================================
   PROCESS SERVER RESPONSE
   ========================================================= */

function processResult(data) {

  console.log("Server response:", data);

  const type = data.type || "STUDENT";
  const isTeacher = type === "TEACHER";

  const name = isTeacher
    ? (data.teacherName || "")
    : (data.studentName || "");

  const qrId = data.qrId || "";
  const usedAt = data.usedAt || "";
  const message = data.message || "";

  // STUDENT DATA
  const studentClass = data.studentClass || "";
  const section = data.section || "";
  const coupon = data.coupon || "";

  // TEACHER DATA
  const designation = data.designation || "";
  const department = data.department || "";


  // ==========================================
  // SUCCESS
  // ==========================================

  if (
    data.success === true &&
    data.result === "SUCCESS"
  ) {

    showResult(
      "success",
      "✅",

      isTeacher
        ? "TEACHER VERIFIED"
        : "COUPON ACCEPTED",

      name,

      isTeacher
        ? buildTeacherDetails(
            qrId,
            designation,
            department,
            usedAt
          )
        : buildDetails(
            qrId,
            studentClass,
            section,
            coupon,
            usedAt
          ),

      message ||
      (
        isTeacher
          ? "Teacher verified successfully."
          : "Coupon accepted successfully."
      )
    );

    return;
  }


  // ==========================================
  // ALREADY USED
  // ==========================================

  if (data.result === "ALREADY USED") {

    let previousScan = "";

    if (usedAt) {

      try {
        previousScan =
          new Date(usedAt).toLocaleString();
      } catch (e) {
        previousScan = usedAt;
      }
    }


    showResult(
      "error",
      "🔴",
      "ALREADY USED",
      name,

      isTeacher
        ? buildTeacherDetails(
            qrId,
            designation,
            department,
            usedAt
          )
        : buildDetails(
            qrId,
            studentClass,
            section,
            coupon
          ),

      (
        isTeacher
          ? "This teacher QR has already been verified."
          : "This coupon has already been used."
      ) +

      (
        previousScan
          ? "<br><br><b>Previous scan:</b><br>" +
            escapeHtml(previousScan)
          : ""
      )
    );

    return;
  }


  // ==========================================
  // INVALID
  // ==========================================

  showResult(
    "error",
    "❌",
    "INVALID QR",
    "",
    qrId
      ? "<b>QR ID:</b> " + escapeHtml(qrId)
      : "",
    message || "This QR code is not valid."
  );
}
  function buildTeacherDetails(
  qrId,
  designation,
  department,
  usedAt
) {
  let html = "";

  if (designation) {
    html +=
      "<b>Designation:</b> " +
      escapeHtml(designation);
  }

  if (department) {
    html +=
      "<br><b>Department:</b> " +
      escapeHtml(department);
  }

  if (qrId) {
    html +=
      "<br><b>QR ID:</b> " +
      escapeHtml(qrId);
  }

  if (usedAt) {
    let scanTime = "";

    try {
      scanTime = new Date(usedAt).toLocaleString();
    } catch (e) {
      scanTime = usedAt;
    }

    html +=
      "<br><b>Scan Time:</b> " +
      escapeHtml(scanTime);
  }

  return html;
}
  /* =========================================================
   STUDENT DETAILS
   ========================================================= */

function buildDetails(
  qrId,
  studentClass,
  section,
  coupon,
  usedAt
) {

  let html = "";

  if (studentClass) {

    html +=
      "<b>Class:</b> " +
      escapeHtml(studentClass);
  }

  if (section) {

    html +=
      "<br><b>Section:</b> " +
      escapeHtml(section);
  }

  if (qrId) {

    html +=
      "<br><b>QR ID:</b> " +
      escapeHtml(qrId);
  }

  if (coupon !== "") {

    html +=
      "<br><b>Coupon:</b> " +
      escapeHtml(String(coupon));
  }

  if (usedAt) {
    let scanTime = "";

    try {
      scanTime = new Date(usedAt).toLocaleString();
    } catch (e) {
      scanTime = usedAt;
    }

    html +=
      "<br><b>Scan Time:</b> " +
      escapeHtml(scanTime);
  }

  return html;
}


/* =========================================================
   SHOW RESULT
   ========================================================= */

function showResult(
  type,
  icon,
  title,
  name,
  details,
  message
) {

  const result =
    document.getElementById("result");

  result.className = "";

  result.classList.add(type);

  result.style.display = "block";

  document.getElementById("resultIcon")
    .innerHTML = icon;

  document.getElementById("resultTitle")
    .innerHTML = title;

  document.getElementById("studentName")
    .innerHTML = escapeHtml(name);

  document.getElementById("studentDetails")
    .innerHTML = details;

  document.getElementById("resultMessage")
    .innerHTML = message;

  document.getElementById("nextButton")
    .style.display = "inline-block";

  processing = false;
}


/* =========================================================
   NEXT SCAN
   ========================================================= */

function nextScan() {

  document.getElementById("result")
    .style.display = "none";

  document.getElementById("nextButton")
    .style.display = "none";

  processing = false;

  startScanner();
}


/* =========================================================
   STOP CAMERA
   ========================================================= */

function stopScanner() {

  if (!scanner || !scanning) {

    resetScannerButtons();

    return;
  }

  scanner.stop()
    .then(function() {

      scanning = false;

      resetScannerButtons();

    })
    .catch(function(error) {

      console.error(error);

      scanning = false;

      resetScannerButtons();
    });
}


/* =========================================================
   RESET CAMERA BUTTONS
   ========================================================= */

function resetScannerButtons() {

  document.getElementById("startButton")
    .classList.remove("hidden");

  document.getElementById("stopButton")
    .classList.add("hidden");
}


/* =========================================================
   SECURITY / HTML ESCAPING
   ========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
