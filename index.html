<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teachers Day QR Verification</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #222;
  text-align: center;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 650px;
  margin: auto;
  padding: 25px 18px 80px;
}

h1 {
  margin: 5px 0;
  font-size: 34px;
}

.subtitle {
  font-size: 20px;
  color: #666;
  margin-bottom: 25px;
}

.watermark {
  position: fixed;
  bottom: 12px;
  right: 15px;
  font-size: 13px;
  color: #999;
  opacity: 0.7;
  pointer-events: none;
}

button {
  border: none;
  border-radius: 12px;
  padding: 15px 28px;
  font-size: 18px;
  cursor: pointer;
  margin: 8px;
}

.start-btn {
  background: #1976d2;
  color: white;
}

.stop-btn {
  background: #555;
  color: white;
}

.next-btn {
  background: #2e7d32;
  color: white;
}

#reader {
  width: 100%;
  max-width: 600px;
  margin: 20px auto;
  border-radius: 18px;
  overflow: hidden;
  background: #111;
}

#result {
  display: none;
  margin: 25px auto;
  padding: 25px 18px;
  border-radius: 18px;
  background: white;
  border: 5px solid #2e7d32;
}

#result.error {
  border-color: #d32f2f;
}

#result.warning {
  border-color: #f57c00;
}

.icon {
  font-size: 55px;
  margin-bottom: 8px;
}

.result-title {
  font-size: 30px;
  font-weight: bold;
  margin-bottom: 15px;
}

.student-name {
  font-size: 30px;
  font-weight: bold;
  margin: 8px;
}

.details {
  font-size: 19px;
  line-height: 1.7;
  color: #444;
}

.message {
  font-size: 19px;
  margin-top: 15px;
}

#nextButton {
  display: none;
}

#loading {
  display: none;
  margin: 15px;
  font-size: 17px;
  color: #555;
}

.hidden {
  display: none !important;
}

@media (max-width: 600px) {

  .container {
    padding-top: 20px;
  }

  h1 {
    font-size: 32px;
  }

  .subtitle {
    font-size: 18px;
  }

  #reader {
    width: 100%;
  }

  .student-name {
    font-size: 27px;
  }

  .result-title {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>🎟️ Teachers Day</h1>

  <div class="subtitle">
    Student QR Verification
  </div>

  <button id="startButton"
          class="start-btn"
          onclick="startScanner()">
    📷 Start Camera
  </button>

  <button id="stopButton"
          class="stop-btn hidden"
          onclick="stopScanner()">
    ⏹️ Stop Camera
  </button>

  <div id="reader"></div>

  <div id="loading">
    🔄 Verifying QR code...
  </div>

  <div id="result">

    <div id="resultIcon" class="icon"></div>

    <div id="resultTitle" class="result-title"></div>

    <div id="studentName" class="student-name"></div>

    <div id="studentDetails" class="details"></div>

    <div id="resultMessage" class="message"></div>

    <button id="nextButton"
            class="next-btn"
            onclick="nextScan()">
      ➡️ Next Scan
    </button>

  </div>

</div>

<div class="watermark">
  HeavyDukh
</div>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT BACKEND
   ========================================================= */

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbwp1CIZ5tVUa3MyzNsowQLkH1pGjrkW3r-NN2g6_roN6Q33-L-21AqkLmd456wfnen0yw/exec";


/* =========================================================
   SCANNER VARIABLES
   ========================================================= */

let scanner = null;
let scanning = false;
let processing = false;


/* =========================================================
   START CAMERA
   ========================================================= */

function startScanner() {

  if (scanning) return;

  document.getElementById("result").style.display = "none";
  document.getElementById("nextButton").style.display = "none";

  document.getElementById("startButton")
    .classList.add("hidden");

  document.getElementById("stopButton")
    .classList.remove("hidden");

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    onScanSuccess,

    function(errorMessage) {
      // Ignore normal scanning errors
    }

  ).then(function() {

    scanning = true;

  }).catch(function(error) {

    console.error(error);

    alert(
      "Camera could not start.\n\n" +
      "Please allow camera permission and try again."
    );

    resetScannerButtons();

  });
}


/* =========================================================
   QR SCANNED
   ========================================================= */

function onScanSuccess(decodedText) {

  if (processing) return;

  processing = true;

  stopScanner();

  const qrId = decodedText.trim();

  if (!qrId) {

    showResult(
      "error",
      "❌",
      "INVALID QR",
      "",
      "",
      "The QR code is empty or invalid."
    );

    return;
  }

  verifyQR(qrId);
}


/* =========================================================
   VERIFY QR WITH GOOGLE APPS SCRIPT
   ========================================================= */

function verifyQR(qrId) {

  document.getElementById("loading").style.display = "block";

  const callbackName =
    "qrCallback_" + Date.now();

  window[callbackName] = function(data) {

    document.getElementById("loading").style.display = "none";

    try {

      processResult(data);

    } catch (error) {

      console.error(error);

      showResult(
        "error",
        "⚠️",
        "ERROR",
        "",
        "",
        "Could not process the server response."
      );
    }

    delete window[callbackName];

    const script =
      document.getElementById(callbackName);

    if (script) {
      script.remove();
    }
  };


  const script = document.createElement("script");

  script.id = callbackName;

  script.src =
    BACKEND_URL +
    "?qrId=" +
    encodeURIComponent(qrId) +
    "&callback=" +
    callbackName +
    "&_=" +
    Date.now();

  script.onerror = function() {

    document.getElementById("loading").style.display = "none";

    showResult(
      "error",
      "⚠️",
      "CONNECTION ERROR",
      "",
      "",
      "Unable to connect to the verification server."
    );

    delete window[callbackName];

    script.remove();
  };

  document.body.appendChild(script);
}


/* =========================================================
   PROCESS SERVER RESPONSE
   ========================================================= */

function processResult(data) {

  console.log("Server response:", data);

  const name =
    data.studentName || "";

  const studentClass =
    data.studentClass || "";

  const section =
    data.section || "";

  const qrId =
    data.qrId || "";

  const coupon =
    data.coupon || "";

  const usedAt =
    data.usedAt || "";

  const message =
    data.message || "";


  /* ---------- SUCCESS ---------- */

  if (
    data.success === true &&
    data.result === "SUCCESS"
  ) {

    showResult(
      "success",
      "✅",
      "COUPON ACCEPTED",
      name,
      buildDetails(
        qrId,
        studentClass,
        section,
        coupon
      ),
      message || "Coupon accepted successfully."
    );

    return;
  }


  /* ---------- ALREADY USED ---------- */

  if (
    data.result === "ALREADY USED"
  ) {

    let previousScan = "";

    if (usedAt) {

      try {

        previousScan =
          new Date(usedAt).toLocaleString();

      } catch(e) {

        previousScan = usedAt;
      }
    }

    showResult(
      "error",
      "🔴",
      "ALREADY USED",
      name,
      buildDetails(
        qrId,
        studentClass,
        section,
        coupon
      ),
      "This coupon has already been used." +
      (previousScan
        ? "<br><br><b>Previous scan:</b><br>" +
          previousScan
        : "")
    );

    return;
  }


  /* ---------- INVALID ---------- */

  showResult(
    "error",
    "❌",
    "INVALID QR",
    name,
    buildDetails(
      qrId,
      studentClass,
      section,
      coupon
    ),
    message || "This QR code is not valid."
  );
}


/* =========================================================
   STUDENT DETAILS
   ========================================================= */

function buildDetails(
  qrId,
  studentClass,
  section,
  coupon
) {

  let html = "";

  if (studentClass) {

    html +=
      "<b>Class:</b> " +
      escapeHtml(studentClass);
  }

  if (section) {

    html +=
      "<br><b>Section:</b> " +
      escapeHtml(section);
  }

  if (qrId) {

    html +=
      "<br><b>QR ID:</b> " +
      escapeHtml(qrId);
  }

  if (coupon !== "") {

    html +=
      "<br><b>Coupon:</b> " +
      escapeHtml(String(coupon));
  }

  return html;
}


/* =========================================================
   SHOW RESULT
   ========================================================= */

function showResult(
  type,
  icon,
  title,
  name,
  details,
  message
) {

  const result =
    document.getElementById("result");

  result.className = "";

  result.classList.add(type);

  result.style.display = "block";

  document.getElementById("resultIcon")
    .innerHTML = icon;

  document.getElementById("resultTitle")
    .innerHTML = title;

  document.getElementById("studentName")
    .innerHTML = escapeHtml(name);

  document.getElementById("studentDetails")
    .innerHTML = details;

  document.getElementById("resultMessage")
    .innerHTML = message;

  document.getElementById("nextButton")
    .style.display = "inline-block";

  processing = false;
}


/* =========================================================
   NEXT SCAN
   ========================================================= */

function nextScan() {

  document.getElementById("result")
    .style.display = "none";

  document.getElementById("nextButton")
    .style.display = "none";

  processing = false;

  startScanner();
}


/* =========================================================
   STOP CAMERA
   ========================================================= */

function stopScanner() {

  if (!scanner || !scanning) {

    resetScannerButtons();

    return;
  }

  scanner.stop()
    .then(function() {

      scanning = false;

      resetScannerButtons();

    })
    .catch(function(error) {

      console.error(error);

      scanning = false;

      resetScannerButtons();
    });
}


/* =========================================================
   RESET CAMERA BUTTONS
   ========================================================= */

function resetScannerButtons() {

  document.getElementById("startButton")
    .classList.remove("hidden");

  document.getElementById("stopButton")
    .classList.add("hidden");
}


/* =========================================================
   SECURITY / HTML ESCAPING
   ========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
